<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D'RAX AI Assistant | ARDRAXIS OSIS SMA IGS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-dark: #091a1e;
      --bg-card: rgba(14, 38, 44, 0.75);
      --border-card: rgba(45, 212, 191, 0.25);
      --primary: #2dd4bf;
      --primary-hover: #14b8a6;
      --accent: #fbbf24;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --user-msg-bg: linear-gradient(135deg, #0d9488, #0f766e);
      --ai-msg-bg: rgba(15, 23, 42, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Open Sans', sans-serif;
      background: radial-gradient(circle at top right, #112a32 0%, #061114 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navbar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(9, 26, 30, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-card);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(45, 212, 191, 0.5));
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary);
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--primary);
      color: #091a1e;
    }

    /* Main Container */
    .chat-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 16px auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      height: calc(100vh - 100px);
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Welcome / Empty State */
    .welcome-box {
      text-align: center;
      margin: auto;
      max-width: 500px;
      padding: 20px;
    }

    .welcome-box i {
      font-size: 3.5rem;
      color: var(--primary);
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 0 12px rgba(45, 212, 191, 0.4));
    }

    .welcome-box h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .welcome-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .suggestions-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .suggestion-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .suggestion-chip:hover {
      background: rgba(45, 212, 191, 0.15);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .avatar.ai {
      background: rgba(45, 212, 191, 0.2);
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .avatar.user {
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .bubble {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .message-row.user .bubble {
      background: var(--user-msg-bg);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.ai .bubble {
      background: var(--ai-msg-bg);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .bubble p {
      margin-bottom: 8px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble ul, .bubble ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    /* Loading Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    .input-area {
      padding: 16px 20px;
      background: rgba(9, 26, 30, 0.9);
      border-top: 1px solid var(--border-card);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 6px 14px;
      transition: border-color 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.2);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      padding: 10px 0;
      font-family: inherit;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary);
      border: none;
      color: #091a1e;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 640px) {
      .chat-container {
        margin: 0;
        border-radius: 0;
        height: calc(100vh - 65px);
        border: none;
      }
      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <a href="/home" class="brand">
      <i class="bi bi-robot" style="font-size: 1.5rem; color: var(--primary);"></i>
      <div class="brand-text">
        <h1>D'RAX AI ASSISTANT</h1>
        <p>OSIS SMA Ignatius Global School</p>
      </div>
    </a>
    <a href="/home" class="nav-btn">
      <i class="bi bi-house"></i> Home OSIS
    </a>
  </header>

  <!-- Chat Container -->
  <div class="chat-container">
    
    <!-- Messages Scroll Area -->
    <div id="messagesArea" class="messages-area">
      <div id="welcomeBox" class="welcome-box">
        <i class="bi bi-cpu"></i>
        <h2>Halo! Saya D'RAX</h2>
        <p>AI Assistant Resmi OSIS SMA IGS. Ada yang bisa saya bantu terkait informasi anggota, Sekbid, atau agenda kegiatan OSIS?</p>
        
        <div id="suggestionsGrid" class="suggestions-grid">
          <button class="suggestion-chip" onclick="sendSuggestion('Siapa Ketua OSIS SMA IGS?')">
            <i class="bi bi-person-badge"></i> Siapa Ketua OSIS SMA IGS?
          </button>
          <button class="suggestion-chip" onclick="sendSuggestion('Apa saja kegiatan event OSIS?')">
            <i class="bi bi-calendar-event"></i> Apa saja kegiatan event OSIS?
          </button>
          <button class="suggestion-chip" onclick="sendSuggestion('Siapa penanggung jawab Sekbid 1?')">
            <i class="bi bi-people"></i> Siapa penanggung jawab Sekbid 1?
          </button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <form id="chatForm" onsubmit="handleSubmit(event)">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="messageInput" 
            class="chat-input" 
            placeholder="Tanyakan sesuatu kepada D'RAX..." 
            autocomplete="off"
            required
          />
          <button type="submit" id="sendBtn" class="send-btn" title="Kirim Pesan">
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
      </form>
    </div>

  </div>

  <script>
    const messagesArea = document.getElementById('messagesArea');
    const welcomeBox = document.getElementById('welcomeBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    let isWaiting = false;

    // Fetch prompt suggestions from API
    fetch('/api/v1/suggestions')
      .then(res => res.json())
      .then(data => {
        if (data.suggestions && data.suggestions.length > 0) {
          const grid = document.getElementById('suggestionsGrid');
          grid.innerHTML = data.suggestions.map(sug => `
            <button class="suggestion-chip" onclick="sendSuggestion('${sug.replace(/'/g, "\\'")}')">
              <i class="bi bi-chat-quote"></i> ${sug}
            </button>
          `).join('');
        }
      })
      .catch(() => {});

    function sendSuggestion(text) {
      if (isWaiting) return;
      messageInput.value = text;
      handleSubmit();
    }

    function appendMessage(role, text) {
      if (welcomeBox) {
        welcomeBox.style.display = 'none';
      }

      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = `avatar ${role}`;
      avatar.innerHTML = role === 'user' ? '<i class="bi bi-person"></i>' : '<i class="bi bi-robot"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      if (role === 'ai') {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesArea.appendChild(row);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function showTypingIndicator() {
      const row = document.createElement('div');
      row.id = 'typingIndicator';
      row.className = 'message-row ai';
      row.innerHTML = `
        <div class="avatar ai"><i class="bi bi-robot"></i></div>
        <div class="bubble typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      messagesArea.appendChild(row);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function hideTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    async function handleSubmit(e) {
      if (e) e.preventDefault();
      const message = messageInput.value.trim();
      if (!message || isWaiting) return;

      appendMessage('user', message);
      messageInput.value = '';
      isWaiting = true;
      sendBtn.disabled = true;

      showTypingIndicator();

      try {
        const response = await fetch('/api/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        hideTypingIndicator();

        if (!response.ok) {
          const errData = await response.json().catch(() => null);
          throw new Error(errData?.error || 'Gagal terhubung ke server.');
        }

        const data = await response.json();
        appendMessage('ai', data.response || 'Maaf, tidak ada respon.');
      } catch (err) {
        hideTypingIndicator();
        appendMessage('ai', `⚠️ **Error**: ${err.message}`);
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }
  </script>
</body>
</html>
